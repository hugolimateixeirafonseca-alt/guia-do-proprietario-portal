name: Temporary Radar article update check

on:
  push:
    branches:
      - fix/radar-impacts-4-5-6
    paths:
      - .github/workflows/tmp-radar-article-update-check.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build

