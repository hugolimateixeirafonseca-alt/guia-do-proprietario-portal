name: Validar texto editorial

on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/validate-copy.mjs', '.github/workflows/check-editorial-copy.yml']
  pull_request:
    paths: ['src/**', 'scripts/validate-copy.mjs', '.github/workflows/check-editorial-copy.yml']

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: node scripts/validate-copy.mjs
