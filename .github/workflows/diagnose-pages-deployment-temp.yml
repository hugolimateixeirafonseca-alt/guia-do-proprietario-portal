name: Diagnose Pages Deployment Temp

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-pages-deployment-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_PAGES_PROJECT: guia-do-proprietario-portal
      DEPLOYMENT_ID: fc319b58-f46f-4a3e-9083-3ff97a2836ce
    steps:
      - name: Fetch failed deployment details
        shell: bash
        run: |
          node <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const project = process.env.CF_PAGES_PROJECT;
          const id = process.env.DEPLOYMENT_ID;
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}/deployments/${id}`;
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
          });
          const data = await response.json().catch(() => ({}));
          console.log(`HTTP ${response.status}`);
          const d = data?.result || {};
          console.log(JSON.stringify({
            success: data?.success,
            errors: data?.errors,
            deployment: {
              id: d.id,
              environment: d.environment,
              url: d.url,
              created_on: d.created_on,
              modified_on: d.modified_on,
              aliases: d.aliases,
              latest_stage: d.latest_stage,
              stages: d.stages,
              deployment_trigger: d.deployment_trigger,
              source: d.source,
              build_config: d.build_config,
            },
          }, null, 2));
          if (!response.ok) process.exit(1);
          NODE
