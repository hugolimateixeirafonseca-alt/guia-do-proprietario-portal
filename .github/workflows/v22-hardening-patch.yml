name: Apply Editorial Radar v22 Hardening

on:
  push:
    branches:
      - agent/editorial-radar-v22-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Harden Editorial Radar v22' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/editorial-radar-v22-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch v22
        run: python3 automation/editorial-radar/v22-hardening-patch.py
      - name: Validate hardening
        run: |
          node --check automation/editorial-radar/radar-v22.mjs
          node --check automation/editorial-radar/source-harvest.mjs
          node --test automation/editorial-radar/*.test.mjs
          git diff --check
      - name: Commit hardening
        run: |
          rm .github/workflows/v22-hardening-patch.yml
          rm automation/editorial-radar/v22-hardening-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Editorial Radar v22"
          git push origin HEAD:agent/editorial-radar-v22-hardening
