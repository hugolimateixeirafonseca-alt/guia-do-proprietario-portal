name: Render Reel

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Slug do Reel a renderizar
        required: true
        default: herdei-uma-casa
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      REEL_SLUG: ${{ inputs.slug }}

    steps:
      - name: Obter repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/reels/requirements.txt

      - name: Instalar FFmpeg e Inter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-inter
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-match Inter

      - name: Instalar Pillow
        run: python -m pip install --requirement scripts/reels/requirements.txt

      - name: Validar slug
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REEL_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Slug inválido: $REEL_SLUG"
            exit 1
          fi

      - name: Renderizar Reel
        run: >-
          python scripts/reels/render.py
          --input "scripts/reels/data/${{ env.REEL_SLUG }}.json"
          --output "out/reels/${{ env.REEL_SLUG }}.mp4"

      - name: Mostrar e validar metadados
        shell: bash
        run: |
          set -euo pipefail
          FILE="out/reels/$REEL_SLUG.mp4"
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            "$FILE"

          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$FILE")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$FILE")"
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$FILE")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$FILE")"
          AUDIO="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$FILE" | wc -l)"
          AUDIO_CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$FILE" || true)"

          [[ "$WIDTH" == "1080" && "$HEIGHT" == "1920" ]] || { echo "::error::Resolução inválida: ${WIDTH}x${HEIGHT}"; exit 1; }
          [[ "$CODEC" == "h264" ]] || { echo "::error::Codec inválido: $CODEC"; exit 1; }
          [[ "$FPS" == "30/1" ]] || { echo "::error::FPS inválido: $FPS"; exit 1; }
          if [[ -f "scripts/reels/assets/background.mp3" ]]; then
            [[ "$AUDIO" == "1" ]] || { echo "::error::A faixa existe, mas o vídeo não contém exatamente uma pista de áudio."; exit 1; }
            [[ "$AUDIO_CODEC" == "aac" ]] || { echo "::error::Codec de áudio inválido: $AUDIO_CODEC"; exit 1; }
          else
            [[ "$AUDIO" == "0" ]] || { echo "::error::O vídeo contém áudio sem existir background.mp3."; exit 1; }
          fi

      - name: Guardar Reel e contact sheet
        uses: actions/upload-artifact@v7
        with:
          name: reel-${{ env.REEL_SLUG }}
          path: |
            out/reels/${{ env.REEL_SLUG }}.mp4
            out/reels/${{ env.REEL_SLUG }}-contact.jpg
          if-no-files-found: error
          compression-level: 0
