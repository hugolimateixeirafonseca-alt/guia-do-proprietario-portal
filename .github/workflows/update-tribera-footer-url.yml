name: Update Tribera footer URL

on:
  push:
    branches:
      - landing-tribera-olaias
    paths:
      - .github/workflows/update-tribera-footer-url.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing-tribera-olaias

      - name: Add UTMs to every Tribera Olaias link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/tribera-olaias.astro')
          s = p.read_text(encoding='utf-8')
          old = 'const triberaPage = "https://triberaliving.com/pt-pt/lisbon/lisbon-olaias-student-accommodation/";'
          new = 'const triberaPage = "https://triberaliving.com/pt-pt/lisbon/lisbon-olaias-student-accommodation/?utm_source=guiadoproprietario&utm_medium=referral&utm_campaign=tribera_olaias";'
          if old not in s:
              raise SystemExit('triberaPage sem tracking não encontrado')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/update-tribera-footer-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/tribera-olaias.astro .github/workflows/update-tribera-footer-url.yml
          git commit -m "fix: aplicar UTMs a todos os links Tribera Olaias"
          git push origin HEAD:landing-tribera-olaias
