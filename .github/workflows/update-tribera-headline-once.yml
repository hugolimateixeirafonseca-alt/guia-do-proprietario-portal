name: Update Tribera headline once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-tribera-headline-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update headline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/tribera-olaias.astro')
          s = p.read_text(encoding='utf-8')
          old = '<h1>Um quarto em Lisboa.<br /><em>Sem tratar de tudo o resto.</em></h1>'
          new = '<h1>Um quarto em Lisboa.<br /><em>Com tudo incluído.</em></h1>'
          if old not in s:
              raise SystemExit('Headline original não encontrada')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/update-tribera-headline-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/tribera-olaias.astro .github/workflows/update-tribera-headline-once.yml
          git commit -m 'copy: alterar headline da landing Tribera'
          git push origin main
