name: Observable Meta Form Runner

on:
  pull_request:
    paths:
      - '.automation/trigger-meta-form/**'

permissions:
  contents: read

concurrency:
  group: pages-social-functions-production
  cancel-in-progress: false

jobs:
  create-meta-form:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_PAGES_PROJECT: guia-do-proprietario-portal
      META_FORM_ENDPOINT: https://guiadoproprietario.pt/api/meta/create-kit-form
      PUBLIC_META_PIXEL_ID: '1394294186173855'
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_PAGES_API_TOKEN'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build trusted main
        run: npm run build

      - name: Generate one-time form secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "META_FORM_ADMIN_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Enable temporary creator
        id: enable
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              deployment_configs: {
                production: {
                  env_vars: {
                    META_FORM_ADMIN_SECRET: {
                      type: 'secret_text',
                      value: process.env.META_FORM_ADMIN_SECRET
                    }
                  }
                }
              }
            })
          });
          const payload = await response.json();
          console.log(JSON.stringify({status: response.status, success: payload.success, errors: payload.errors || [], messages: payload.messages || []}));
          if (!response.ok || !payload.success) throw new Error('enable_creator_failed');
          NODE

      - name: Deploy trusted main with temporary creator
        id: deploy
        run: |
          npx wrangler pages deploy dist             --project-name="$CF_PAGES_PROJECT"             --branch=main             --commit-hash="$GITHUB_SHA"             --commit-dirty=false             --commit-message="Observable Meta form creation"

      - name: Create or reuse Instant Form
        id: create
        run: |
          node --input-type=module <<'NODE'
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            const response = await fetch(process.env.META_FORM_ENDPOINT, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.META_FORM_ADMIN_SECRET}`,
                Accept: 'application/json'
              }
            });
            const body = await response.text();
            console.log(JSON.stringify({attempt, status: response.status, body: body.slice(0, 1200)}));
            if (response.status === 404) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              continue;
            }
            if (!response.ok) throw new Error(`form_creator_http_${response.status}`);
            const payload = JSON.parse(body);
            if (!payload.ok || !payload.id) throw new Error('form_creator_invalid_response');
            console.log(`META_FORM_ID=${payload.id}; created=${payload.created}`);
            process.exit(0);
          }
          throw new Error('form_creator_not_available');
          NODE

      - name: Disable temporary creator
        if: always()
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              deployment_configs: {
                production: {
                  env_vars: {
                    META_FORM_ADMIN_SECRET: null
                  }
                }
              }
            })
          });
          const payload = await response.json();
          console.log(JSON.stringify({status: response.status, success: payload.success, errors: payload.errors || []}));
          if (!response.ok || !payload.success) throw new Error('disable_creator_failed');
          NODE

      - name: Redeploy clean trusted main
        if: always()
        run: |
          npx wrangler pages deploy dist             --project-name="$CF_PAGES_PROJECT"             --branch=main             --commit-hash="$GITHUB_SHA"             --commit-dirty=false             --commit-message="Clean after observable Meta form creation"
