name: Editorial Radar v21.2

on:
  schedule:
    # GitHub cron usa UTC. Em Lisboa, estes horários deslocam 1h entre verão/inverno.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo do radar ou ação de manutenção'
        required: false
        type: choice
        options:
          - morning
          - incremental
          - maintenance-report
          - maintenance-cleanup
        default: 'morning'
      dry_run:
        description: 'true = não envia ao Make'
        required: false
        default: 'true'
      backfill:
        description: 'true = importa arquivo de /novidades para memória histórica'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: editorial-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
      MAKE_RADAR_WEBHOOK: ${{ secrets.MAKE_RADAR_WEBHOOK }}
      MAKE_RADAR_WEBHOOK_SECRET: ${{ secrets.MAKE_RADAR_WEBHOOK_SECRET }}
      OPENAI_SEARCHER_MODEL: gpt-5.6-luna
      OPENAI_VALIDATOR_MODEL: gpt-5.6-luna
      OPENAI_EDITOR_MODEL: gpt-5.6-sol
      OPENAI_IMPACT_MODEL: gpt-5.6-terra
      OPENAI_COPY_MODEL: gpt-5.6-luna
      MAX_RUN_TOKENS: '0'
      MIN_NEWS_SCORE: '70'
      MIN_IMPACT_CONFIDENCE: '80'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve run mode
        if: ${{ github.event_name == 'schedule' || (inputs.mode != 'maintenance-report' && inputs.mode != 'maintenance-cleanup') }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RADAR_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            echo "RADAR_DRY_RUN=${{ inputs.dry_run }}" >> "$GITHUB_ENV"
            echo "BACKFILL=${{ inputs.backfill }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "RADAR_MODE=morning" >> "$GITHUB_ENV"
            echo "RADAR_DRY_RUN=false" >> "$GITHUB_ENV"
            echo "BACKFILL=false" >> "$GITHUB_ENV"
          fi
      - name: Run editorial radar
        if: ${{ github.event_name == 'schedule' || (inputs.mode != 'maintenance-report' && inputs.mode != 'maintenance-cleanup') }}
        run: node automation/editorial-radar/radar.mjs
      - name: Report test events
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'maintenance-report' }}
        run: node automation/editorial-radar/cleanup-test-events.mjs
      - name: Cleanup test events
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'maintenance-cleanup' }}
        run: node automation/editorial-radar/cleanup-test-events.mjs --apply
