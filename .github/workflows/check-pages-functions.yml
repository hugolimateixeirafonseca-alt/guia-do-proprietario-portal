name: Check Pages Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'src/lib/social-card-*.mjs'
      - 'src/lib/social-post-*.mjs'
      - 'automation/social-card-renderer/**'
      - 'tests/social-card-renderer.test.mjs'
      - 'tests/social-post-layout.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-pages-functions.yml'
  pull_request:
    paths:
      - 'functions/**'
      - 'src/lib/social-card-*.mjs'
      - 'src/lib/social-post-*.mjs'
      - 'automation/social-card-renderer/**'
      - 'tests/social-card-renderer.test.mjs'
      - 'tests/social-post-layout.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-pages-functions.yml'

permissions:
  contents: read

jobs:
  build-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test social card renderer
        run: npm run test:renderer
      - name: Render social preview
        run: node scripts/tmp-render-social-preview.mjs
      - name: Upload social preview
        uses: actions/upload-artifact@v4
        with:
          name: social-preview
          path: tmp-preview/social-preview.png
      - name: Build Pages Functions
        run: npm run build:functions
