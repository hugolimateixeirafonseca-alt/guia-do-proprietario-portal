name: Check Pages Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'src/lib/social-card-*.mjs'
      - 'automation/social-card-renderer/**'
      - 'tests/social-card-renderer.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-pages-functions.yml'
  pull_request:
    paths:
      - 'functions/**'
      - 'src/lib/social-card-*.mjs'
      - 'automation/social-card-renderer/**'
      - 'tests/social-card-renderer.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-pages-functions.yml'

permissions:
  contents: read

jobs:
  build-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_PAGES_PROJECT: guia-do-proprietario-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test social card renderer
        run: npm run test:renderer
      - name: Build full production site
        run: npm run build
      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_PAGES_API_TOKEN'; exit 1; }
      - name: Diagnostic production deploy
        shell: bash
        run: |
          npx wrangler pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="${{ github.event.pull_request.base.sha }}" \
            --commit-dirty=false \
            --commit-message="Diagnostic social-image deploy"
