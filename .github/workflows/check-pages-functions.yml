name: Check Pages Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'src/lib/social-card-*.mjs'
      - 'automation/social-card-renderer/**'
      - 'tests/social-card-renderer.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-pages-functions.yml'
  pull_request:
    paths:
      - 'functions/**'
      - 'src/lib/social-card-*.mjs'
      - 'automation/social-card-renderer/**'
      - 'tests/social-card-renderer.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-pages-functions.yml'

permissions:
  contents: read

jobs:
  build-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test social card renderer
        run: npm run test:renderer
      - name: Build Pages Functions
        run: npm run build:functions
      - name: Generate temporary social previews
        run: node automation/social-card-renderer/generate-social-preview-temp.mjs
      - name: Upload temporary social previews
        uses: actions/upload-artifact@v4
        with:
          name: social-card-preview-temp
          path: artifacts/social-card-preview-temp/*.png
          retention-days: 1
