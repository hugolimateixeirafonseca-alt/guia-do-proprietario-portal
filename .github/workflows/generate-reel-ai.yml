name: Generate Reel AI

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Slug do artigo a transformar em Reel
        required: true
        default: herdei-uma-casa
        type: string
      publication_sha:
        description: SHA da publicação original, quando se está a recuperar um Reel automático
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      publication_sha:
        required: false
        default: ""
        type: string
    outputs:
      generation_id:
        description: Identificador único da geração criada
        value: ${{ jobs.generate.outputs.generation_id }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      generation_id: ${{ steps.generation.outputs.generation_id }}
    env:
      REEL_SLUG: ${{ inputs.slug }}
      PUBLICATION_SHA: ${{ inputs.publication_sha || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.publication_sha || github.sha }}

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/reels/requirements.txt

      - name: Reservar tentativa automática inicial
        id: claim
        if: ${{ env.PUBLICATION_SHA != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name não está configurada para reservar o trigger automático."
              exit 1
            fi
          done
          CLAIMED="$(python scripts/reels/automatic_trigger.py claim \
            --slug "$REEL_SLUG" --publication-sha "$PUBLICATION_SHA")"
          echo "claimed=$CLAIMED" >> "$GITHUB_OUTPUT"
          if [[ "$CLAIMED" == "false" ]]; then
            echo "Já existe uma tentativa automática inicial ativa ou concluída para $REEL_SLUG. Nada será gerado."
          fi

      - name: Validar configuração
        if: ${{ env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REEL_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Slug inválido: $REEL_SLUG"
            exit 1
          fi
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::OPENAI_API_KEY não está configurada nos GitHub Actions Secrets."
            exit 1
          fi
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name não está configurada nos GitHub Actions Secrets."
              exit 1
            fi
          done

      - name: Preparar dependências Python e FFmpeg
        if: ${{ env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "A instalar dependências Python com limite de 5 minutos..."
          timeout 300s python -m pip install --requirement scripts/reels/requirements.txt

          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg não está pré-instalado. A usar instalação de fallback com timeouts curtos."

            if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            if [[ -f /etc/apt/sources.list ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
            fi

            timeout 180s sudo apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update
            timeout 180s sudo apt-get install --yes --no-install-recommends ffmpeg
          fi

          command -v ffmpeg >/dev/null 2>&1 || { echo "::error::FFmpeg não está disponível."; exit 1; }
          command -v ffprobe >/dev/null 2>&1 || { echo "::error::ffprobe não está disponível."; exit 1; }
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-match Inter | head -n 1 || true

      - name: Criar identificador único da geração
        id: generation
        if: ${{ env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          GENERATION_ID="$(python scripts/reels/publish_review.py --new-generation-id)"
          echo "GENERATION_ID=$GENERATION_ID" >> "$GITHUB_ENV"
          echo "generation_id=$GENERATION_ID" >> "$GITHUB_OUTPUT"
          echo "REEL_REVIEW_SAVED=false" >> "$GITHUB_ENV"
          echo "Geração: $GENERATION_ID"

      - name: Gerar e validar JSON
        if: ${{ env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "REEL_FAILURE_STAGE=generate_json_failed" >> "$GITHUB_ENV"
          python scripts/reels/generate_json.py \
            --slug "$REEL_SLUG" \
            --output "out/reels-json/$REEL_SLUG.json"

      - name: Renderizar Reel
        if: ${{ env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "REEL_FAILURE_STAGE=render_failed" >> "$GITHUB_ENV"
          python scripts/reels/render.py \
            --input "out/reels-json/$REEL_SLUG.json" \
            --output "out/reels-ai/$REEL_SLUG.mp4"

      - name: Confirmar metadados
        if: ${{ env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "REEL_FAILURE_STAGE=video_validation_failed" >> "$GITHUB_ENV"
          FILE="out/reels-ai/$REEL_SLUG.mp4"
          ffprobe -v error \
            -show_entries stream=codec_name,codec_type,width,height,avg_frame_rate,pix_fmt,duration \
            -show_entries format=duration \
            -of json "$FILE"
          VIDEO_COUNT="$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$FILE" | wc -l)"
          AUDIO_COUNT="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$FILE" | wc -l)"
          [[ "$VIDEO_COUNT" == "1" ]] || { echo "::error::O MP4 não contém exatamente uma pista de vídeo."; exit 1; }
          if [[ -f scripts/reels/assets/background.mp3 ]]; then
            [[ "$AUDIO_COUNT" == "1" ]] || { echo "::error::O MP4 não contém exatamente uma pista de áudio."; exit 1; }
          else
            [[ "$AUDIO_COUNT" == "0" ]] || { echo "::error::Foi encontrado áudio sem background.mp3."; exit 1; }
          fi

      - name: Guardar em R2 e criar revisão pendente
        if: ${{ env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "REEL_FAILURE_STAGE=review_publish_failed" >> "$GITHUB_ENV"
          python scripts/reels/publish_review.py \
            --slug "$REEL_SLUG" \
            --generation-id "$GENERATION_ID" \
            --json "out/reels-json/$REEL_SLUG.json" \
            --video "out/reels-ai/$REEL_SLUG.mp4" \
            --contact "out/reels-ai/$REEL_SLUG-contact.jpg"
          echo "REEL_REVIEW_SAVED=true" >> "$GITHUB_ENV"

      - name: Concluir tentativa automática inicial
        if: ${{ env.PUBLICATION_SHA != '' && steps.claim.outputs.claimed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "REEL_FAILURE_STAGE=trigger_complete_failed" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            if python scripts/reels/automatic_trigger.py complete \
              --slug "$REEL_SLUG" \
              --publication-sha "$PUBLICATION_SHA" \
              --generation-id "$GENERATION_ID"; then
              exit 0
            fi
            echo "::warning::Falhou a conclusão do trigger automático na tentativa $attempt."
            sleep $((attempt * 3))
          done
          echo "::error::Não foi possível concluir o trigger automático após 3 tentativas."
          exit 1

      - name: Registar geração falhada
        if: ${{ failure() && env.GENERATION_ID != '' && env.REEL_REVIEW_SAVED != 'true' && (env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true') }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ERROR_CODE="${REEL_FAILURE_STAGE:-workflow_failed}"
          echo "A registar falha da geração: $ERROR_CODE"
          python scripts/reels/publish_review.py \
            --record-failure \
            --slug "$REEL_SLUG" \
            --generation-id "$GENERATION_ID" \
            --error "$ERROR_CODE"

      - name: Marcar tentativa automática como falhada
        if: ${{ failure() && env.REEL_REVIEW_SAVED != 'true' && env.PUBLICATION_SHA != '' && steps.claim.outputs.claimed == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ERROR_CODE="${REEL_FAILURE_STAGE:-workflow_failed}"
          ARGS=(fail --slug "$REEL_SLUG" --publication-sha "$PUBLICATION_SHA" --error "$ERROR_CODE")
          if [[ -n "${GENERATION_ID:-}" ]]; then
            ARGS+=(--generation-id "$GENERATION_ID")
          fi
          python scripts/reels/automatic_trigger.py "${ARGS[@]}"

      - name: Guardar JSON, Reel e contact sheet
        if: ${{ always() && (env.PUBLICATION_SHA == '' || steps.claim.outputs.claimed == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: reel-ai-${{ env.REEL_SLUG }}-${{ env.GENERATION_ID }}
          path: |
            out/reels-json/${{ env.REEL_SLUG }}.json
            out/reels-ai/${{ env.REEL_SLUG }}.mp4
            out/reels-ai/${{ env.REEL_SLUG }}-contact.jpg
          if-no-files-found: warn
          compression-level: 0
