name: Reconcile missing daily Reels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-reels.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 8,10,12 * * *'

permissions:
  contents: write

concurrency:
  group: reconcile-daily-reels
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ vars.REELS_AUTO_PUBLISH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Obter main com histórico completo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reemitir apenas o candidato diário mais recente
        shell: bash
        run: |
          set -euo pipefail

          # Não usar `git log | awk ... exit` aqui: com pipefail, o awk fecha a
          # pipe assim que encontra o primeiro resultado e o git pode terminar
          # com SIGPIPE (141), fazendo uma reconciliação válida parecer falhada.
          LATEST_SHA=""
          while IFS=$'\t' read -r CANDIDATE_SHA CANDIDATE_SUBJECT; do
            if [[ "$CANDIDATE_SUBJECT" =~ ^Publicar\ [0-9]+\ artigo\ com\ imagem\ automática$ ]]; then
              LATEST_SHA="$CANDIDATE_SHA"
              break
            fi
          done < <(
            git log --since='48 hours ago' \
              --format='%H%x09%s' \
              -- src/content/artigos
          )

          if [[ -z "$LATEST_SHA" ]]; then
            echo "Nenhuma publicação diária das últimas 48 horas para reconciliar."
            exit 0
          fi

          if [[ ! "$LATEST_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA inválido encontrado na reconciliação: $LATEST_SHA"
            exit 1
          fi

          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
              -f event_type='reel_publish_candidate' \
              -f "client_payload[sha]=$LATEST_SHA"; then
              echo "Reconciliação enviada para o candidato mais recente $LATEST_SHA (tentativa $attempt)."
              {
                echo "### Reconciliação de Reels"
                echo "Candidato recente reenviado: \`$LATEST_SHA\`"
                echo "A reconciliação é limitada ao artigo diário mais recente; o claim D1 impede duplicação quando já foi concluído."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Falhou a reconciliação de $LATEST_SHA na tentativa $attempt."
            sleep $((attempt * 5))
          done

          echo "::error::Não foi possível reconciliar $LATEST_SHA após 3 tentativas."
          exit 1
