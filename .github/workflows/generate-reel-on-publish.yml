name: Generate Reel on Production publish

on:
  repository_dispatch:
    types: [reel_publish_candidate]

permissions:
  contents: read

# Não existe concurrency ao nível deste workflow de propósito. O lock autoritativo
# é o claim no D1 dentro de generate-reel-ai.yml. Assim, um detector antigo que
# fique preso a aguardar o Pages nunca bloqueia uma recuperação mais recente.
# Duplicados podem chegar ao detect, mas só um consegue reservar a geração no D1.

jobs:
  detect:
    # Automação ativa por defeito. Só fica desligada quando a variável é
    # explicitamente definida como "false".
    if: ${{ vars.REELS_AUTO_PUBLISH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      slugs: ${{ steps.detect.outputs.slugs }}
      count: ${{ steps.detect.outputs.count }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'guia-do-proprietario-portal' }}
      ACTIVATION_SHA: ${{ vars.REELS_AUTO_PUBLISH_ACTIVATION_SHA }}
    steps:
      - name: Obter main com histórico completo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Exigir ponto de ativação explícito
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ACTIVATION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::REELS_AUTO_PUBLISH_ACTIVATION_SHA não está configurado com um SHA completo."
            exit 1
          fi

      - name: Confirmar deployment Production
        id: check
        run: >-
          python scripts/reels/validate_publish_check.py
          --event "$GITHUB_EVENT_PATH"
          --event-name "$GITHUB_EVENT_NAME"
          --activation-sha "$ACTIVATION_SHA"

      - name: Detetar artigos publicados pela primeira vez
        id: detect
        run: >-
          python scripts/reels/detect_new_publications.py
          --sha "${{ steps.check.outputs.sha }}"

  generate:
    needs: detect
    if: ${{ needs.detect.result == 'success' && needs.detect.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.detect.outputs.slugs) }}
    uses: ./.github/workflows/generate-reel-ai.yml
    with:
      slug: ${{ matrix.slug }}
      publication_sha: ${{ needs.detect.outputs.sha }}
    secrets: inherit
