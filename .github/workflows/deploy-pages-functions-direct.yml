name: Deploy Pages Functions Direct

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'src/components/CookieConsent.astro'
      - 'src/layouts/KitEstudanteLayout.astro'
      - 'src/pages/kit-estudante/**'
      - 'tests/kit-estudante.test.mjs'
      - 'public/social/**'
      - 'public/scripts/landings/limpezas.js'
      - 'public/scripts/landings/alojamento-local-cleaning.js'
      - 'src/pages/social-feed.json.ts'
      - 'scripts/converter-imagens.mjs'
      - 'scripts/check-social-images.mjs'
      - '.github/workflows/check-social-images.yml'
      - '.github/workflows/deploy-pages-functions-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-social-functions-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_PAGES_PROJECT: guia-do-proprietario-portal
      PUBLIC_META_PIXEL_ID_FALLBACK: '1394294186173855'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_PAGES_API_TOKEN'; exit 1; }
          [[ "$PUBLIC_META_PIXEL_ID_FALLBACK" =~ ^[0-9]{10,30}$ ]] || { echo 'Invalid PUBLIC_META_PIXEL_ID_FALLBACK'; exit 1; }

      - name: Persist and load public build variables from Pages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }
          });
          const payload = await response.json();
          if (!response.ok || !payload.success) throw new Error(`Pages project lookup failed with ${response.status}`);

          let configuredPixelId = payload.result?.deployment_configs?.production?.env_vars?.PUBLIC_META_PIXEL_ID?.value || '';
          const fallbackPixelId = process.env.PUBLIC_META_PIXEL_ID_FALLBACK || '';
          if (!/^\d{10,30}$/.test(configuredPixelId)) {
            const updateResponse = await fetch(endpoint, {
              method: 'PATCH',
              headers: {
                Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                deployment_configs: {
                  production: {
                    env_vars: {
                      PUBLIC_META_PIXEL_ID: { type: 'plain_text', value: fallbackPixelId }
                    }
                  }
                }
              })
            });
            const updatePayload = await updateResponse.json();
            if (!updateResponse.ok || !updatePayload.success) {
              throw new Error(`Pages project update failed with ${updateResponse.status}`);
            }
            configuredPixelId = updatePayload.result?.deployment_configs?.production?.env_vars?.PUBLIC_META_PIXEL_ID?.value || '';
            if (configuredPixelId !== fallbackPixelId) {
              throw new Error('PUBLIC_META_PIXEL_ID was not persisted in Pages production');
            }
            console.log('Persisted verified official PUBLIC_META_PIXEL_ID in Pages production.');
          }

          if (!/^\d{10,30}$/.test(configuredPixelId)) {
            throw new Error('PUBLIC_META_PIXEL_ID is missing or invalid in Pages production');
          }
          await appendFile(process.env.GITHUB_ENV, `PUBLIC_META_PIXEL_ID=${configuredPixelId}\n`, 'utf8');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: |
          test -n "$PUBLIC_META_PIXEL_ID" || { echo 'Missing PUBLIC_META_PIXEL_ID'; exit 1; }
          npm run build

      - name: Deploy actual build to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false \
            --commit-message="Deploy social/functions ${GITHUB_SHA:0:12}"
