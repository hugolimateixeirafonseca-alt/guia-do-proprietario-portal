name: Deploy Pages Functions Direct

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'public/social/**'
      - 'src/pages/social-feed.json.ts'
      - 'scripts/converter-imagens.mjs'
      - 'scripts/check-social-images.mjs'
      - '.github/workflows/check-social-images.yml'
      - '.github/workflows/deploy-pages-functions-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-social-functions-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_PAGES_PROJECT: guia-do-proprietario-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_PAGES_API_TOKEN'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Deploy actual build to Cloudflare Pages
        shell: bash
        run: |
          npx wrangler pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false \
            --commit-message="Deploy social/functions ${GITHUB_SHA:0:12}"
