name: Deploy Pages Functions Direct

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'public/social/**'
      - 'src/pages/social-feed.json.ts'
      - '.github/workflows/deploy-pages-functions-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_PAGES_PROJECT: guia-do-proprietario-portal
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_PAGES_API_TOKEN'; exit 1; }

      - name: Ensure deployment for this commit and wait for success
        shell: bash
        run: |
          node <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const project = process.env.CF_PAGES_PROJECT;
          const commit = process.env.GITHUB_SHA;
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}`;
          const deadline = Date.now() + 13 * 60 * 1000;
          const pollMs = 10_000;

          function shaOf(deployment) {
            return deployment?.deployment_trigger?.metadata?.commit_hash || '';
          }
          function branchOf(deployment) {
            return deployment?.deployment_trigger?.metadata?.branch || '';
          }
          function statusOf(deployment) {
            return deployment?.latest_stage?.status || 'idle';
          }

          async function cf(url, init = {}) {
            const response = await fetch(url, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                ...(init.headers || {}),
              },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data?.success === false || data?.result === undefined || data?.result === null) {
              const code = data?.errors?.[0]?.code || 'unknown';
              throw new Error(`Cloudflare API failed: HTTP ${response.status}, code ${code}`);
            }
            return data.result;
          }

          async function findCurrent() {
            const deployments = await cf(`${base}/deployments?env=production&page=1&per_page=25`);
            const matches = deployments.filter((deployment) =>
              shaOf(deployment).toLowerCase() === commit.toLowerCase() &&
              (!branchOf(deployment) || branchOf(deployment) === 'main')
            );
            return (
              matches.find((deployment) => statusOf(deployment) === 'success') ||
              matches.find((deployment) => !['failure', 'canceled'].includes(statusOf(deployment))) ||
              matches[0] ||
              null
            );
          }

          async function create() {
            const form = new FormData();
            form.set('branch', 'main');
            form.set('commit_hash', commit);
            form.set('commit_dirty', 'false');
            form.set('commit_message', `Deploy Pages functions/social ${commit.slice(0, 12)}`);

            const response = await fetch(`${base}/deployments`, {
              method: 'POST',
              body: form,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
              },
            });
            if (response.status === 304) return null;
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data?.success === false || !data?.result) {
              const code = data?.errors?.[0]?.code || 'unknown';
              throw new Error(`Cloudflare create failed: HTTP ${response.status}, code ${code}`);
            }
            return data.result;
          }

          let deployment = await findCurrent();
          if (!deployment) deployment = await create();

          while (!deployment) {
            if (Date.now() >= deadline) throw new Error('Timed out locating deployment after create/304.');
            await new Promise((resolve) => setTimeout(resolve, pollMs));
            deployment = await findCurrent();
          }

          if (!deployment?.id) throw new Error('Deployment id missing.');
          let lastStatus = '';
          while (true) {
            const status = statusOf(deployment);
            if (status !== lastStatus) {
              console.log(`Pages deployment ${deployment.id}: ${status}`);
              lastStatus = status;
            }
            if (status === 'success') {
              console.log(JSON.stringify({ ok: true, deployment_id: deployment.id, commit, status }, null, 2));
              break;
            }
            if (status === 'failure' || status === 'canceled') throw new Error(`Pages deployment ${status}.`);
            if (Date.now() >= deadline) throw new Error('Timed out waiting for Pages deployment success.');
            await new Promise((resolve) => setTimeout(resolve, pollMs));
            deployment = await cf(`${base}/deployments/${deployment.id}`);
          }
          NODE
