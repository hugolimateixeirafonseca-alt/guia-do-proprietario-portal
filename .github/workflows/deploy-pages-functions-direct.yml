name: Deploy Pages Functions Direct

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'public/social/**'
      - 'src/pages/social-feed.json.ts'
      - 'scripts/converter-imagens.mjs'
      - 'scripts/check-social-images.mjs'
      - '.github/workflows/check-social-images.yml'
      - '.github/workflows/deploy-pages-functions-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-social-functions-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_PAGES_PROJECT: guia-do-proprietario-portal
      PUBLIC_META_PIXEL_ID_FALLBACK: '1394294186173855'
      META_FORM_ENDPOINT: https://guiadoproprietario.pt/api/meta/create-kit-form
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_PAGES_API_TOKEN'; exit 1; }
          [[ "$PUBLIC_META_PIXEL_ID_FALLBACK" =~ ^[0-9]{10,30}$ ]] || { echo 'Invalid PUBLIC_META_PIXEL_ID_FALLBACK'; exit 1; }

      - name: Persist and load public build variables from Pages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }
          });
          const payload = await response.json();
          if (!response.ok || !payload.success) throw new Error(`Pages project lookup failed with ${response.status}`);

          let configuredPixelId = payload.result?.deployment_configs?.production?.env_vars?.PUBLIC_META_PIXEL_ID?.value || '';
          const fallbackPixelId = process.env.PUBLIC_META_PIXEL_ID_FALLBACK || '';
          if (!/^\d{10,30}$/.test(configuredPixelId)) {
            const updateResponse = await fetch(endpoint, {
              method: 'PATCH',
              headers: {
                Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                deployment_configs: {
                  production: {
                    env_vars: {
                      PUBLIC_META_PIXEL_ID: { type: 'plain_text', value: fallbackPixelId }
                    }
                  }
                }
              })
            });
            const updatePayload = await updateResponse.json();
            if (!updateResponse.ok || !updatePayload.success) {
              throw new Error(`Pages project update failed with ${updateResponse.status}`);
            }
            configuredPixelId = updatePayload.result?.deployment_configs?.production?.env_vars?.PUBLIC_META_PIXEL_ID?.value || '';
            if (configuredPixelId !== fallbackPixelId) {
              throw new Error('PUBLIC_META_PIXEL_ID was not persisted in Pages production');
            }
            console.log('Persisted verified official PUBLIC_META_PIXEL_ID in Pages production.');
          }

          const pixelId = configuredPixelId;
          if (!/^\d{10,30}$/.test(pixelId)) throw new Error('PUBLIC_META_PIXEL_ID is missing or invalid in Pages production');
          await appendFile(process.env.GITHUB_ENV, `PUBLIC_META_PIXEL_ID=${pixelId}\n`, 'utf8');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        shell: bash
        run: |
          test -n "$PUBLIC_META_PIXEL_ID" || { echo 'Missing PUBLIC_META_PIXEL_ID'; exit 1; }
          npm run build

      - name: Generate one-time Meta form admin secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "META_FORM_ADMIN_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Enable one-time Meta form creator in Cloudflare
        id: enable_meta_form
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              deployment_configs: {
                production: {
                  env_vars: {
                    META_FORM_ADMIN_SECRET: {
                      type: 'secret_text',
                      value: process.env.META_FORM_ADMIN_SECRET
                    }
                  }
                }
              }
            })
          });
          const payload = await response.json();
          if (!response.ok || !payload.success) {
            throw new Error(`Could not enable temporary Meta form creator (${response.status})`);
          }
          NODE

      - name: Deploy build with one-time Meta form authorization
        id: deploy_with_meta_form_secret
        shell: bash
        run: |
          npx wrangler pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false \
            --commit-message="Deploy Meta form creator ${GITHUB_SHA:0:12}"

      - name: Create or reuse Meta Instant Form
        id: create_meta_form
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          let lastStatus = 0;
          let lastBody = '';
          for (let attempt = 1; attempt <= 8; attempt += 1) {
            const response = await fetch(process.env.META_FORM_ENDPOINT, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.META_FORM_ADMIN_SECRET}`,
                Accept: 'application/json'
              }
            });
            lastStatus = response.status;
            lastBody = await response.text();
            if (response.status !== 404) {
              let payload = {};
              try { payload = JSON.parse(lastBody); } catch {}
              if (!response.ok || !payload.ok || !payload.id) {
                throw new Error(`Meta form creator failed: HTTP ${response.status} ${lastBody.slice(0, 500)}`);
              }
              console.log(`${payload.created ? 'Created' : 'Reused'} Meta Instant Form ID ${payload.id}`);
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error(`Meta form endpoint did not become available: HTTP ${lastStatus} ${lastBody.slice(0, 300)}`);
          NODE

      - name: Disable one-time Meta form creator in Cloudflare
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              deployment_configs: {
                production: {
                  env_vars: {
                    META_FORM_ADMIN_SECRET: null
                  }
                }
              }
            })
          });
          const payload = await response.json();
          if (!response.ok || !payload.success) {
            throw new Error(`Could not remove temporary Meta form creator secret (${response.status})`);
          }
          NODE

      - name: Redeploy clean build after Meta form creation
        if: always()
        shell: bash
        run: |
          npx wrangler pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false \
            --commit-message="Deploy clean social/functions ${GITHUB_SHA:0:12}"
