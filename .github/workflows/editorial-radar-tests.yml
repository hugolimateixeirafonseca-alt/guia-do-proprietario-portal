name: Editorial Radar Tests

on:
  pull_request:
    paths:
      - 'automation/editorial-radar/**'
      - '.github/workflows/editorial-radar.yml'
      - '.github/workflows/editorial-radar-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check v22
        run: |
          node --check automation/editorial-radar/radar-v22.mjs
          node --check automation/editorial-radar/source-metadata.mjs
          node --check automation/editorial-radar/editorial-scoring.mjs
          node --check automation/editorial-radar/factual-extraction.mjs
          node --check automation/editorial-radar/publication-evidence.mjs
          node --check automation/editorial-radar/publication-image-prompt.mjs
      - name: Editorial Radar test suite
        run: node --test automation/editorial-radar/*.test.mjs
