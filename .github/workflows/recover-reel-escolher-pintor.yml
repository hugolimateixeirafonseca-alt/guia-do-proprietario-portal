name: Recover missing Reel escolher-pintor-orcamentos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-reel-escolher-pintor.yml

permissions:
  contents: read

jobs:
  recover:
    uses: ./.github/workflows/generate-reel-ai.yml
    with:
      slug: escolher-pintor-orcamentos
    secrets: inherit

  reconcile-original-trigger:
    needs: recover
    runs-on: ubuntu-24.04
    env:
      GENERATION_ID: ${{ needs.recover.outputs.generation_id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Obter repositório atual
        uses: actions/checkout@v6

      - name: Fechar trigger automático original
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GENERATION_ID" ]]; then
            echo "::error::A recuperação não devolveu generation_id."
            exit 1
          fi
          python scripts/reels/automatic_trigger.py complete \
            --slug escolher-pintor-orcamentos \
            --publication-sha 98c6e1b89b5fecb494fbcafc6a9c28c0f1a0c713 \
            --generation-id "$GENERATION_ID"
