name: Editorial Radar Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação de manutenção a executar'
        required: true
        type: choice
        options:
          - report-test-events
          - cleanup-test-events

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run maintenance action
        shell: bash
        run: |
          if [[ "${{ inputs.action }}" == "cleanup-test-events" ]]; then
            node automation/editorial-radar/cleanup-test-events.mjs --apply
          else
            node automation/editorial-radar/cleanup-test-events.mjs
          fi
