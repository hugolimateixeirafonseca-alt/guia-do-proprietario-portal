name: Apply viral priority pulse patch

on:
  push:
    branches:
      - agent/viral-priority-pulse-v1
    paths:
      - '.github/workflows/apply-viral-priority-pulse.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/viral-priority-pulse-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Apply patch
        run: python .tmp/apply-viral-pulse.py
      - name: Syntax and focused tests
        run: |
          node --check automation/editorial-radar/radar-v22.mjs
          node --check automation/editorial-radar/factual-extraction.mjs
          node --check automation/editorial-radar/viral-priority.mjs
          node --test automation/editorial-radar/viral-priority.test.mjs
          npm run test:radar
      - name: Validate workflow YAML
        run: node -e "const fs=require('fs'); const t=fs.readFileSync('.github/workflows/editorial-radar.yml','utf8'); if(!t.includes('RADAR_MODE=pulse')||!t.includes('30 9,12,15,18')) process.exit(1)"
      - name: Remove temporary patch files
        run: rm -f .tmp/apply-viral-pulse.py .github/workflows/apply-viral-priority-pulse.yml
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/editorial-radar .github/workflows .tmp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: adicionar prioridade viral e rondas pulse ao Radar"
          git push origin HEAD:agent/viral-priority-pulse-v1
