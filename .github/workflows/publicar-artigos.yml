name: Publicar artigos

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - publicar_artigos

permissions:
  contents: write

concurrency:
  group: publicar-artigos-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-4.1-mini
      OPENAI_IMAGE_MODEL: gpt-image-2
      REELS_AUTO_PUBLISH_ENABLED: ${{ vars.REELS_AUTO_PUBLISH_ENABLED }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Selecionar, preparar imagem e mover 1 artigo
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="src/content/por-publicar"
          DESTINATION="src/content/artigos"
          QUEUE="src/content/fila-publicacao-artigos.txt"
          MAX_ARTICLES=1
          SELECTION_SOURCE=""

          if [[ ! -d "$SOURCE" ]]; then
            echo "::error::A pasta $SOURCE não existe."
            exit 1
          fi

          mkdir -p "$DESTINATION"
          FILES=()

          # A fila é uma prioridade opcional, não a fonte de verdade.
          # Se existir, usar o primeiro artigo da fila que ainda esteja em por-publicar.
          if [[ -f "$QUEUE" ]]; then
            while IFS= read -r NAME || [[ -n "$NAME" ]]; do
              NAME="${NAME%$'\r'}"
              [[ -z "$NAME" ]] && continue
              [[ "$NAME" == \#* ]] && continue

              if [[ "$NAME" == */* ]] || [[ "$NAME" != *.mdx ]]; then
                echo "::error::Entrada inválida na fila: $NAME"
                exit 1
              fi

              if [[ -f "$SOURCE/$NAME" ]]; then
                FILES+=("$SOURCE/$NAME")
                SELECTION_SOURCE="queue"
              fi

              if [[ "${#FILES[@]}" -ge "$MAX_ARTICLES" ]]; then
                break
              fi
            done < "$QUEUE"
          else
            echo "::warning::O ficheiro de prioridade $QUEUE não existe; será usado o fallback automático."
          fi

          # Se a fila não tiver nenhum artigo atualmente disponível, escolher
          # automaticamente o artigo mais antigo que exista em por-publicar.
          if [[ "${#FILES[@]}" -eq 0 ]]; then
            OLDEST_NAME=""
            OLDEST_TS=""

            while IFS= read -r NAME; do
              [[ -z "$NAME" ]] && continue
              TS="$(git log --follow --format=%ct --reverse -- "$SOURCE/$NAME" | sed -n '1p')"
              [[ -n "$TS" ]] || TS="9999999999"

              if [[ -z "$OLDEST_NAME" ]] || (( TS < OLDEST_TS )) || { (( TS == OLDEST_TS )) && [[ "$NAME" < "$OLDEST_NAME" ]]; }; then
                OLDEST_NAME="$NAME"
                OLDEST_TS="$TS"
              fi
            done < <(find "$SOURCE" -maxdepth 1 -type f -name '*.mdx' -printf '%f\n' | sort)

            if [[ -n "$OLDEST_NAME" ]]; then
              FILES+=("$SOURCE/$OLDEST_NAME")
              SELECTION_SOURCE="fallback"
              echo "::warning::FILA_DESATUALIZADA: nenhum item da fila está disponível; selecionado automaticamente $OLDEST_NAME."
            fi
          fi

          COUNT="${#FILES[@]}"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "SEM_ARTIGOS: não existem artigos em $SOURCE."
            {
              echo "### Publicação diária"
              echo "Nenhum artigo pendente em \`$SOURCE\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            if [[ -e "$DESTINATION/$NAME" ]]; then
              echo "::error::Já existe um artigo com o nome $NAME em $DESTINATION."
              exit 1
            fi
          done

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            SLUG="${NAME%.mdx}"

            node scripts/preparar-imagem-artigo.mjs "$FILE"
            node scripts/preparar-publicacao-artigos.mjs "$FILE"

            git mv -- "$FILE" "$DESTINATION/$NAME"
            git add -- "$DESTINATION/$NAME"

            if [[ -f "imagens/artigos/$SLUG.png" ]]; then
              git add -- "imagens/artigos/$SLUG.png"
            fi

            # Quando a prioridade veio da fila, retirar automaticamente o item
            # que acabou de ser publicado. A fila passa a conter só prioridades futuras.
            if [[ "$SELECTION_SOURCE" == "queue" && -f "$QUEUE" ]]; then
              TMP_QUEUE="$(mktemp)"
              awk -v target="$NAME" '
                {
                  line=$0
                  sub(/\r$/, "", line)
                  if (line == target) next
                  print $0
                }
              ' "$QUEUE" > "$TMP_QUEUE"
              mv "$TMP_QUEUE" "$QUEUE"
              git add -- "$QUEUE"
            fi

            echo "Preparado e movido: $NAME (seleção: $SELECTION_SOURCE)"
          done

          npm run validate:dates

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
            exit 0
          fi

          git commit -m "Publicar $COUNT artigo com imagem automática"
          git push origin HEAD:main

          PUBLISHED_SHA="$(git rev-parse HEAD)"
          echo "Artigo publicado no SHA $PUBLISHED_SHA."
          {
            echo "### Publicação diária"
            echo "**PUBLICADO:** \`$(basename "${FILES[0]}")\`"
            echo "Origem da seleção: **$SELECTION_SOURCE**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$REELS_AUTO_PUBLISH_ENABLED" == "true" ]]; then
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
              -f event_type='reel_publish_candidate' \
              -f "client_payload[sha]=$PUBLISHED_SHA"; then
              echo "::error::O artigo foi publicado, mas não foi possível emitir o repository_dispatch para o Reel."
              exit 1
            fi
            echo "Candidato a Reel enviado para validação: $PUBLISHED_SHA."
          else
            echo "Geração automática de Reels desligada. Nenhum dispatch foi emitido."
          fi
