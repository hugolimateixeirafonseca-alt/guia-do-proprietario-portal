name: Publicar artigos

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - publicar_artigos

permissions:
  contents: write

concurrency:
  group: publicar-artigos-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Selecionar e mover até 1 artigo
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="src/content/por-publicar"
          DESTINATION="src/content/artigos"
          QUEUE="src/content/fila-publicacao-artigos.txt"
          MAX_ARTICLES=1

          if [[ ! -d "$SOURCE" ]]; then
            echo "::error::A pasta $SOURCE não existe."
            exit 1
          fi

          if [[ ! -f "$QUEUE" ]]; then
            echo "::error::O ficheiro de prioridade $QUEUE não existe."
            exit 1
          fi

          mkdir -p "$DESTINATION"
          FILES=()

          while IFS= read -r NAME || [[ -n "$NAME" ]]; do
            NAME="${NAME%$'\r'}"
            [[ -z "$NAME" ]] && continue
            [[ "$NAME" == \#* ]] && continue

            if [[ "$NAME" == */* ]] || [[ "$NAME" != *.mdx ]]; then
              echo "::error::Entrada inválida na fila: $NAME"
              exit 1
            fi

            if [[ -f "$SOURCE/$NAME" ]]; then
              FILES+=("$SOURCE/$NAME")
            fi

            if [[ "${#FILES[@]}" -ge "$MAX_ARTICLES" ]]; then
              break
            fi
          done < "$QUEUE"

          COUNT="${#FILES[@]}"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "Não existem artigos da fila disponíveis para publicar."
            exit 0
          fi

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            if [[ -e "$DESTINATION/$NAME" ]]; then
              echo "::error::Já existe um artigo com o nome $NAME em $DESTINATION."
              exit 1
            fi
          done

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            node scripts/preparar-publicacao-artigos.mjs "$FILE"
            git mv -- "$FILE" "$DESTINATION/$NAME"
            git add -- "$DESTINATION/$NAME"
            echo "Movido: $NAME"
          done

          npm run validate:dates

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publicar $COUNT artigos automaticamente"
          git push origin HEAD:main
