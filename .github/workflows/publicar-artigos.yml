name: Publicar artigos

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - publicar_artigos

permissions:
  contents: write

concurrency:
  group: publicar-artigos-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Selecionar e mover até 3 artigos
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="src/content/por-publicar"
          DESTINATION="src/content/artigos"

          if [[ ! -d "$SOURCE" ]]; then
            echo "::error::A pasta $SOURCE não existe."
            exit 1
          fi

          mkdir -p "$DESTINATION"

          mapfile -d '' -t FILES < <(
            find "$SOURCE" -maxdepth 1 -type f -name '*.mdx' -print0               | sort -z               | head -z -n 3
          )

          COUNT="${#FILES[@]}"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "Não existem artigos .mdx por publicar."
            exit 0
          fi

          # Validar tudo antes de alterar qualquer ficheiro.
          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"

            if [[ -e "$DESTINATION/$NAME" ]]; then
              echo "::error::Já existe um artigo com o nome $NAME em $DESTINATION."
              exit 1
            fi
          done

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            git mv -- "$FILE" "$DESTINATION/$NAME"
            echo "Movido: $NAME"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Publicar $COUNT artigos automaticamente"
          git push origin HEAD:main
