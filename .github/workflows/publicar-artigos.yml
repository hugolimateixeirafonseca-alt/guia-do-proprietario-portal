name: Publicar artigos

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - publicar_artigos

permissions:
  contents: write

concurrency:
  group: publicar-artigos-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-4.1-mini
      OPENAI_IMAGE_MODEL: gpt-image-2
      GH_TOKEN: ${{ github.token }}
      OPS_DASHBOARD_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}

    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Instalar dependências
        run: npm ci

      - name: Selecionar, preparar imagem e mover 1 artigo
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="src/content/por-publicar"
          DESTINATION="src/content/artigos"
          QUEUE="src/content/fila-publicacao-artigos.txt"
          MAX_ARTICLES=1
          SELECTION_SOURCE=""

          if [[ ! -d "$SOURCE" ]]; then
            echo "::error::A pasta $SOURCE não existe."
            exit 1
          fi

          mkdir -p "$DESTINATION"
          FILES=()

          if [[ -f "$QUEUE" ]]; then
            while IFS= read -r NAME || [[ -n "$NAME" ]]; do
              NAME="${NAME%$'\r'}"
              [[ -z "$NAME" ]] && continue
              [[ "$NAME" == \#* ]] && continue

              if [[ "$NAME" == */* ]] || [[ "$NAME" != *.mdx ]]; then
                echo "::error::Entrada inválida na fila: $NAME"
                exit 1
              fi

              if [[ -f "$SOURCE/$NAME" ]]; then
                FILES+=("$SOURCE/$NAME")
                SELECTION_SOURCE="queue"
              fi

              if [[ "${#FILES[@]}" -ge "$MAX_ARTICLES" ]]; then
                break
              fi
            done < "$QUEUE"
          else
            echo "::warning::O ficheiro de prioridade $QUEUE não existe; será usado o fallback automático."
          fi

          if [[ "${#FILES[@]}" -eq 0 ]]; then
            OLDEST_NAME=""
            OLDEST_TS=""

            while IFS= read -r NAME; do
              [[ -z "$NAME" ]] && continue
              TS="$(git log --follow --format=%ct --reverse -- "$SOURCE/$NAME" | sed -n '1p')"
              [[ -n "$TS" ]] || TS="9999999999"

              if [[ -z "$OLDEST_NAME" ]] || (( TS < OLDEST_TS )) || { (( TS == OLDEST_TS )) && [[ "$NAME" < "$OLDEST_NAME" ]]; }; then
                OLDEST_NAME="$NAME"
                OLDEST_TS="$TS"
              fi
            done < <(find "$SOURCE" -maxdepth 1 -type f -name '*.mdx' -printf '%f\n' | sort)

            if [[ -n "$OLDEST_NAME" ]]; then
              FILES+=("$SOURCE/$OLDEST_NAME")
              SELECTION_SOURCE="fallback"
              echo "::warning::FILA_DESATUALIZADA: nenhum item da fila está disponível; selecionado automaticamente $OLDEST_NAME."
            fi
          fi

          COUNT="${#FILES[@]}"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "SEM_ARTIGOS: não existem artigos em $SOURCE."
            {
              echo "### Publicação diária"
              echo "Nenhum artigo pendente em \`$SOURCE\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            if [[ -e "$DESTINATION/$NAME" ]]; then
              echo "::error::Já existe um artigo com o nome $NAME em $DESTINATION."
              exit 1
            fi
          done

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            SLUG="${NAME%.mdx}"

            node scripts/preparar-imagem-artigo.mjs "$FILE"
            node scripts/preparar-publicacao-artigos.mjs "$FILE"

            git mv -- "$FILE" "$DESTINATION/$NAME"
            git add -- "$DESTINATION/$NAME"

            if [[ -f "imagens/artigos/$SLUG.png" ]]; then
              git add -- "imagens/artigos/$SLUG.png"
            fi

            if [[ "$SELECTION_SOURCE" == "queue" && -f "$QUEUE" ]]; then
              TMP_QUEUE="$(mktemp)"
              awk -v target="$NAME" '
                {
                  line=$0
                  sub(/\r$/, "", line)
                  if (line == target) next
                  print $0
                }
              ' "$QUEUE" > "$TMP_QUEUE"
              mv "$TMP_QUEUE" "$QUEUE"
              git add -- "$QUEUE"
            fi

            echo "Preparado e movido: $NAME (seleção: $SELECTION_SOURCE)"
          done

          npm run images:convert

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            SLUG="${NAME%.mdx}"
            for EXTENSION in avif webp; do
              PUBLIC_IMAGE="public/imagens/artigos/$SLUG.$EXTENSION"
              if [[ ! -f "$PUBLIC_IMAGE" ]]; then
                echo "::error::Falta a imagem pública $PUBLIC_IMAGE."
                exit 1
              fi
              git add -- "$PUBLIC_IMAGE"
            done
          done

          npm run validate:dates
          npm run validate:images

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
            exit 0
          fi

          git commit -m "Publicar $COUNT artigo com imagem automática"
          git push origin HEAD:main

          PUBLISHED_SHA="$(git rev-parse HEAD)"
          echo "Artigo publicado no SHA $PUBLISHED_SHA."
          {
            echo "### Publicação diária"
            echo "**PUBLICADO:** \`$(basename "${FILES[0]}")\`"
            echo "Origem da seleção: **$SELECTION_SOURCE**"
            echo "Deploy do portal: **solicitado**"
          } >> "$GITHUB_STEP_SUMMARY"

          # Um push feito pelo GITHUB_TOKEN não dispara de forma fiável outro
          # workflow baseado em push. Avisar o dashboard explicitamente aqui.
          if [[ -n "${OPS_DASHBOARD_TOKEN:-}" ]]; then
            for attempt in 1 2 3; do
              if curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $OPS_DASHBOARD_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/hugolimateixeirafonseca-alt/guia-do-proprietario-ops/dispatches \
                --data '{"event_type":"portal_content_changed"}'; then
                echo "Dashboard operacional avisado (tentativa $attempt)."
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "::warning::Não foi possível avisar imediatamente o dashboard após 3 tentativas; ficará disponível a sincronização periódica."
              else
                sleep $((attempt * 5))
              fi
            done
          else
            echo "::warning::OPS_DASHBOARD_TOKEN não está configurado; o dashboard usará a sincronização periódica."
          fi

          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type='deploy_portal' \
            -f "client_payload[sha]=$PUBLISHED_SHA"; then
            echo "::error::O artigo entrou no main, mas não foi possível solicitar o deploy do portal."
            exit 1
          fi
          echo "Deploy do portal solicitado para $PUBLISHED_SHA."

          # O Reel é disparado já aqui e o próprio workflow de Reels confirma o
          # deployment Production antes de gerar. Assim um watcher lento do Pages
          # nunca consegue impedir o Reel diário de arrancar.
          REEL_DISPATCHED=false
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
              -f event_type='reel_publish_candidate' \
              -f "client_payload[sha]=$PUBLISHED_SHA"; then
              echo "Candidato a Reel enviado diretamente: $PUBLISHED_SHA (tentativa $attempt)."
              REEL_DISPATCHED=true
              break
            fi
            echo "::warning::Falhou o dispatch direto do Reel na tentativa $attempt."
            sleep $((attempt * 5))
          done
          if [[ "$REEL_DISPATCHED" != "true" ]]; then
            echo "::warning::O dispatch direto do Reel falhou; a reconciliação diária irá recuperar este SHA automaticamente."
          fi
