name: Social Card Preview Temp

on:
  push:
    branches:
      - feat/social-card-variant

permissions:
  contents: write

jobs:
  preview:
    if: ${{ !contains(github.event.head_commit.message, '[skip preview]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/social-card-variant
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: node automation/social-card-renderer/generate-social-preview-temp.mjs
      - name: Commit previews to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/social-card-preview-temp/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip preview] test: store social card previews"
          git push origin HEAD:feat/social-card-variant
