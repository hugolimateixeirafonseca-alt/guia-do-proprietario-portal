name: Update Tribera booking URL

on:
  push:
    branches:
      - landing-tribera-olaias
    paths:
      - .github/workflows/update-tribera-booking-url.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing-tribera-olaias

      - name: Point all booking CTAs to Lisbon Olaias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/tribera-olaias.astro')
          text = page.read_text(encoding='utf-8')
          old = 'const bookingUrl = "https://book.triberaliving.com/?utm_source=guiadoproprietario&utm_medium=referral&utm_campaign=tribera_olaias";'
          new = 'const bookingUrl = "https://triberaliving.com/pt-pt/lisbon/lisbon-olaias-student-accommodation/?utm_source=guiadoproprietario&utm_medium=referral&utm_campaign=tribera_olaias";'
          if old not in text:
              raise SystemExit('bookingUrl antigo não encontrado')
          page.write_text(text.replace(old, new), encoding='utf-8')

          doc = Path('docs/landings/tribera-olaias/LANDING-INTEGRATION.md')
          d = doc.read_text(encoding='utf-8')
          d = d.replace(
              '- Substituir `bookingUrl` pelo link de tracking específico fornecido pela Tribera, assim que existir.\n',
              '- `bookingUrl` aponta diretamente para a página Tribera Lisbon Olaias com `utm_source=guiadoproprietario`, `utm_medium=referral` e `utm_campaign=tribera_olaias`.\n'
          )
          d = d.replace(
              'Parâmetros de campanha esperados: o link outbound usa `utm_source=guiadoproprietario`, `utm_medium=referral`, `utm_campaign=tribera_olaias`.',
              'Parâmetros de campanha esperados: todos os CTAs de reserva apontam para `https://triberaliving.com/pt-pt/lisbon/lisbon-olaias-student-accommodation/` com `utm_source=guiadoproprietario`, `utm_medium=referral`, `utm_campaign=tribera_olaias`.'
          )
          doc.write_text(d, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/update-tribera-booking-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/tribera-olaias.astro docs/landings/tribera-olaias/LANDING-INTEGRATION.md .github/workflows/update-tribera-booking-url.yml
          git commit -m "fix: apontar CTAs Tribera para Lisbon Olaias"
          git push origin HEAD:landing-tribera-olaias
