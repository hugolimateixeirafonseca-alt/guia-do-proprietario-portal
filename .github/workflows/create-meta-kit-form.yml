name: Create Meta Kit Student Form

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-meta-kit-form.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-social-functions-production
  cancel-in-progress: false

jobs:
  create-form:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
      CF_PAGES_PROJECT: guia-do-proprietario-portal
      META_FORM_ENDPOINT: https://guiadoproprietario.pt/api/meta/create-kit-form
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Validate required Cloudflare secrets
        id: validate
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_PAGES_API_TOKEN'; exit 1; }

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Load public build variables
        id: load_vars
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }
          });
          const payload = await response.json();
          if (!response.ok || !payload.success) throw new Error(`Pages project lookup failed with ${response.status}`);
          const pixelId = payload.result?.deployment_configs?.production?.env_vars?.PUBLIC_META_PIXEL_ID?.value || '';
          if (!/^\d{10,30}$/.test(pixelId)) throw new Error('PUBLIC_META_PIXEL_ID is missing or invalid in Pages production');
          await appendFile(process.env.GITHUB_ENV, `PUBLIC_META_PIXEL_ID=${pixelId}\n`, 'utf8');
          NODE

      - name: Build production site before touching secrets
        id: build
        run: npm run build

      - name: Generate one-time form admin secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "META_FORM_ADMIN_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Enable one-time form creator in Cloudflare
        id: enable
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              deployment_configs: {
                production: {
                  env_vars: {
                    META_FORM_ADMIN_SECRET: {
                      type: 'secret_text',
                      value: process.env.META_FORM_ADMIN_SECRET
                    }
                  }
                }
              }
            })
          });
          const payload = await response.json();
          if (!response.ok || !payload.success) throw new Error(`Could not enable temporary form creator (${response.status})`);
          NODE

      - name: Deploy endpoint with one-time authorization
        id: deploy_enable
        shell: bash
        run: |
          npx wrangler pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false \
            --commit-message="Enable one-time Meta form creator"

      - name: Create or reuse Meta Instant Form
        id: create_form
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          let lastStatus = 0;
          let lastBody = '';
          for (let attempt = 1; attempt <= 8; attempt += 1) {
            const response = await fetch(process.env.META_FORM_ENDPOINT, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.META_FORM_ADMIN_SECRET}`,
                Accept: 'application/json'
              }
            });
            lastStatus = response.status;
            lastBody = await response.text();
            if (response.status !== 404) {
              let payload = {};
              try { payload = JSON.parse(lastBody); } catch {}
              if (!response.ok || !payload.ok || !payload.id) {
                const diagnostic = `HTTP ${response.status} ${lastBody.slice(0, 500)}`;
                await appendFile(process.env.GITHUB_OUTPUT, `diagnostic_b64=${Buffer.from(diagnostic).toString("base64")}\n`, 'utf8');
                throw new Error(`Meta form creator failed: ${diagnostic}`);
              }
              console.log(`${payload.created ? 'Created' : 'Reused'} Meta Instant Form ID ${payload.id}`);
              await appendFile(process.env.GITHUB_OUTPUT, `form_id=${payload.id}\ncreated=${payload.created}\n`, 'utf8');
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          const diagnostic = `endpoint unavailable: HTTP ${lastStatus} ${lastBody.slice(0, 300)}`;
          await appendFile(process.env.GITHUB_OUTPUT, `diagnostic_b64=${Buffer.from(diagnostic).toString("base64")}\n`, 'utf8');
          throw new Error(`Meta form endpoint did not become available: HTTP ${lastStatus} ${lastBody.slice(0, 300)}`);
          NODE

      - name: Disable one-time form creator in Cloudflare
        id: disable
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const response = await fetch(endpoint, {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              deployment_configs: {
                production: {
                  env_vars: {
                    META_FORM_ADMIN_SECRET: null
                  }
                }
              }
            })
          });
          const payload = await response.json();
          if (!response.ok || !payload.success) throw new Error(`Could not remove temporary form creator secret (${response.status})`);
          NODE

      - name: Redeploy without one-time authorization
        id: deploy_disable
        if: always()
        shell: bash
        run: |
          if [ -d dist ]; then
            npx wrangler pages deploy dist \
              --project-name="$CF_PAGES_PROJECT" \
              --branch=main \
              --commit-hash="$GITHUB_SHA" \
              --commit-dirty=false \
              --commit-message="Disable one-time Meta form creator"
          fi

      - name: Summary
        if: success()
        shell: bash
        run: |
          echo "Meta Instant Form ready: ${{ steps.create_form.outputs.form_id }}"

      - name: Publish diagnostic snapshot
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LOAD_VARS_OUTCOME: ${{ steps.load_vars.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ENABLE_OUTCOME: ${{ steps.enable.outcome }}
          DEPLOY_ENABLE_OUTCOME: ${{ steps.deploy_enable.outcome }}
          CREATE_OUTCOME: ${{ steps.create_form.outcome }}
          FORM_ID: ${{ steps.create_form.outputs.form_id }}
          FORM_CREATED: ${{ steps.create_form.outputs.created }}
          FORM_DIAGNOSTIC_B64: ${{ steps.create_form.outputs.diagnostic_b64 }}
          DISABLE_OUTCOME: ${{ steps.disable.outcome }}
          DEPLOY_DISABLE_OUTCOME: ${{ steps.deploy_disable.outcome }}
        run: |
          mkdir -p .automation
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const result = {
            generated_at: new Date().toISOString(),
            commit: process.env.GITHUB_SHA,
            steps: {
              validate: process.env.VALIDATE_OUTCOME || "not_run",
              install: process.env.INSTALL_OUTCOME || "not_run",
              load_vars: process.env.LOAD_VARS_OUTCOME || "not_run",
              build: process.env.BUILD_OUTCOME || "not_run",
              enable: process.env.ENABLE_OUTCOME || "not_run",
              deploy_enable: process.env.DEPLOY_ENABLE_OUTCOME || "not_run",
              create_form: process.env.CREATE_OUTCOME || "not_run",
              disable: process.env.DISABLE_OUTCOME || "not_run",
              deploy_disable: process.env.DEPLOY_DISABLE_OUTCOME || "not_run"
            },
            form_id: process.env.FORM_ID || "",
            created: process.env.FORM_CREATED || "",
            diagnostic_b64: process.env.FORM_DIAGNOSTIC_B64 || ""
          };
          await writeFile(".automation/meta-kit-form-result.json", JSON.stringify(result, null, 2) + "\n", "utf8");
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/meta-form-result
          git add .automation/meta-kit-form-result.json
          git commit -m "Record Meta form automation result" || true
          git push --force origin automation/meta-form-result
